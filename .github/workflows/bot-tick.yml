# Drives the bot when it's hosted on Vercel (serverless functions have no background timer).
# Every 5 minutes this calls /api/cron, which enforces open stops/targets and scans for IFVG setups.
# Setup: repo Settings -> Secrets and variables -> Actions:
#   BOT_URL     = https://<your-app>.vercel.app
#   CRON_SECRET = same value as the CRON_SECRET env var on Vercel
name: bot-tick
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BOT_URL" ]; then echo "BOT_URL secret not set, skipping"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BOT_URL/api/cron"
